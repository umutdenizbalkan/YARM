# SPDX-License-Identifier: Apache-2.0

[package]
name = "yarm"
version = "0.1.0"
edition = "2024"
autobins = false

[workspace]
members = [
    ".",
    "crates/yarm-ipc-abi",
    "crates/yarm-srv-common",
    "crates/yarm-kernel",
    "crates/yarm-control-plane-servers",
    "crates/yarm-fs-servers",
    "crates/yarm-network-servers",
    "crates/yarm-driver-servers",
    "crates/yarm-ui-servers",
    "crates/yarm-compat-servers",
    "crates/yarm-runtime-tools",
    "crates/yarm-server-runtime",
    "crates/yarm-freestanding-alloc",
    "crates/yarm-user-rt",
]
resolver = "2"

[features]
default = ["hosted-dev"]
hosted-dev = []
posix-compat = []
linux-compat = ["posix-compat"]
trace_boot_vm = []
trace_frame_alloc = []
legacy-tests = []
rpi5-stage1 = []
rpi5-highhalf = ["rpi5-stage1"]
# Canonical 199E: the RISC-V S-mode timer has NO opt-in feature, and deliberately no entry
# here. Its former gate was deleted outright rather than emptied, so nothing in this manifest
# can be mistaken for one. The periodic supervisor timer is unconditional, armed pre-idle at the
# boot safe point and owned by the boot hart; see `doc/ARCH_RISCV64.md` §14. Do not reintroduce
# a feature for it — two guards in `src/kernel/boot/tests.rs` fail if the old name reappears.
# Stage 198E3C1: compile-time gate for the x86_64 DIRECT shared-region live-oracle marker paths
# (kernel attestations + `IpcSendSharedRegionDirect` retirement literals). OFF by default so a
# NORMAL artifact is marker-clean (contains none of the shared-region marker literals). Enabling the
# feature only COMPILES the marker paths; the runtime selector
# (`yarm.x86_64_shared_region_direct_oracle=1`) is still required to execute the oracle — the feature
# alone activates no runtime behavior. x86_64-only; never enables the queued class or any non-x86 arch.
#
# Stage 198E3C2B: `shared-region-direct-oracle` is the ARCH-NEUTRAL umbrella that compiles the shared
# kernel logic (provisioning, authoritative ack, direct producer gate). Each per-arch feature enables
# it AND gates that arch's marker literals + boot caller. Marker literals are additionally
# `target_arch`-gated so the AArch64 feature never activates x86 markers (and vice versa).
shared-region-direct-oracle = []
x86-shared-region-direct-oracle = ["shared-region-direct-oracle"]
aarch64-shared-region-direct-oracle = ["shared-region-direct-oracle"]
riscv-shared-region-direct-oracle = ["shared-region-direct-oracle"]

# Stage 199A2B4/199A2C1: compile-time gate for the DIRECT IpcCall/IpcReply live round-trip oracle
# (kernel success attestations + `IpcCallDirectRequest`/`IpcReplyDirect` retirement literals + the
# transactional provisioning + the arch-neutral userspace round-trip core). OFF by default so a
# NORMAL artifact is marker-clean (contains neither class literal). `ipccall-direct-oracle` is the
# ARCH-NEUTRAL umbrella that compiles the shared kernel logic; each per-arch feature enables it AND
# gates that arch's marker literals + boot caller (the marker literals are additionally
# `target_arch`-gated so the AArch64 feature never activates x86 markers, and vice versa). Enabling
# a feature only COMPILES the marker paths; the runtime selector (`yarm.<arch>_ipccall_direct_oracle
# =1`) is still required to execute the oracle. Enables NO queued class, timeout, notification, or
# server-death wake.
ipccall-direct-oracle = []
x86-ipccall-direct-oracle = ["ipccall-direct-oracle"]
aarch64-ipccall-direct-oracle = ["ipccall-direct-oracle"]
riscv-ipccall-direct-oracle = ["ipccall-direct-oracle"]
# Stage 199A2D2A: x86_64 SMP=2 cross-CPU DIRECT IpcCall (request-only) oracle. Separate from the
# SMP=1 functional oracle above and mutually exclusive with it at runtime (distinct selector). Only
# COMPILES the cross-CPU SMP marker paths; activation additionally requires QEMU_SMP>=2 and the
# runtime selector `yarm.x86_64_ipccall_direct_smp_oracle=1`. Depends on the umbrella so the shared
# direct-transaction logic + class literals compile.
x86-ipccall-direct-smp-oracle = ["ipccall-direct-oracle"]

# Stage 200C2B core: the ARCH-NEUTRAL reply-timeout retirement machinery (the reversible NR7
# reply-win reserve/commit/rollback, the `ClaimedByReply` deadline lease, the NARROW off-lock
# collector + per-CPU deferred-work drain, the single `complete_reply_timeout_over` transaction, and
# the class retirement markers). Enabled by each per-arch oracle feature below; never selected
# directly. Compiles the same body for every arch — only the trap-entry wire, feature/selector,
# userspace wrapper and live proof are arch-specific.
ipc-reply-timeout-oracle-core = []

# Stage 200C2A/200C2B: default-off x86_64 LIVE reply-receive TIMEOUT retirement oracle. Activation
# requires `target_arch = x86_64`, this feature, and the selector
# `yarm.x86_64_ipc_reply_timeout_oracle=timeout-wins|reply-wins`. Retires the `IpcReplyTimeout`
# class off the broad `SpinLock<KernelState>` (scan_broad_lock=0); ordinary receive timeouts stay
# in-lock. Feature-OFF x86_64 artifacts contain none of the Stage 200C live marker literals.
x86-ipc-reply-timeout-oracle = ["ipc-reply-timeout-oracle-core"]
# Stage 200D-0B1: the x86_64 disposable-task ExitCurrentTask live oracle. Selector, marker
# and gate literals compile ONLY with this feature; the production NR16 syscall, its
# decoder and the disposition consumer are unconditional.
x86-exit-current-task-oracle = []
# Stage 200D-0C1: the AArch64 disposable-task ExitCurrentTask live oracle — the AArch64 sibling
# of the cell above. Selector, marker and gate literals compile ONLY with this feature; the
# production NR16 syscall, its decoder, the disposition publication and the AArch64 post-lock
# disposition consumer are unconditional. Feature-OFF AArch64 artifacts contain none of the
# Stage 200D-0C oracle literals.
aarch64-exit-current-task-oracle = []
# U9-SEND-FINAL §3: accepted and inert here, so one `--features` argument can reach every
# package the artifact build touches. Only yarm-control-plane-servers acts on it.
ipc-send-final-fault-witness = []
# U9-PAGEFAULT1 §3: accepted and inert here, so one `--features` argument can reach every package
# the artifact build touches. Only yarm-control-plane-servers and yarm-user-rt act on it.
pagefault1-demand-witness = []
# QEMU-BASELINE1 §3: accepted and inert here, so one `--features` argument reaches every package
# the artifact build touches. Only yarm-control-plane-servers and yarm-user-rt act on it.
timer-contract-witness = []
# U9-FUTEX-WAIT-FINAL §4: gates the NR 9 NONBLOCKING-completion probe in the futex oracles.
#
# Same reason as `ipc-send-final-fault-witness`, measured the same way: init's address space runs
# at `AddressSpace::MAX_MAPPINGS` on the provisioned oracle profiles, and compiling the probe
# unconditionally cost one more mapping run — enough to make the XFER2 grant witness fail with
# `VM_FULL reason=mapping_bookkeeping_full max_mappings=128 va=0x40000000`. Feature-off builds
# carry none of its literals and are byte-identical to a build without it, so every other slot-5
# profile keeps the headroom it had.
futex-wait-nonblock-probe = []
# U9-TIMER5 §3: gates the IDLE-BOUNDARY RETURN witness cell in init.
#
# Same reason as `ipc-send-final-fault-witness`, measured the same way: init's address space runs
# at `AddressSpace::MAX_MAPPINGS` on the provisioned oracle profiles, and compiling this cell
# unconditionally cost one more mapping run — enough to make the XFER2 grant witness fail with
# `VM_FULL reason=mapping_bookkeeping_full max_mappings=128 va=0x40000000`. Feature-off builds
# carry none of its literals and are byte-identical to a build without it, so every other slot-5
# profile keeps the headroom it had.
timer5-idle-return-witness = []
# QEMU-IRQ1: the first real external-interrupt witness — RISC-V UART0 -> PLIC -> YARM on QEMU
# virt. Compiles the kernel-only device window install, the idle-origin supervisor-external
# admission, the UART setup/drain fixture, the provisioning of init's notification + ring page, the
# NR 5 non-blocking notification-receive arm, and init's receiver cell. A build without it maps no
# device, enables no source, admits no S-mode external interrupt and keeps NR 5 endpoint-only.
# Accepted and inert outside the kernel and yarm-control-plane-servers.
riscv-uart-irq-witness = []
# U9-RECV-QUEUE1 §3: the queued shared-region grant taken by the ORDINARY receive syscalls
# (NR 2 and NR 5) rather than by NR 30. A cargo feature and not only a runtime selector, for the
# same reason the send-fault cell is one: init's address space runs at `MAX_MAPPINGS` and its
# image sits 19 bytes under a page boundary, so ~500 bytes of extra cell text costs a whole page
# and the oracle window can no longer be mapped. Gated off, the image is byte-identical to one
# without the cell. Accepted and inert outside yarm-control-plane-servers.
recv-queue1-ordinary-grant = []
# Stage 200D-0D1: the RISC-V disposable-task ExitCurrentTask live oracle — the third and final
# arch cell. Selector, marker and gate literals compile ONLY with this feature; the production
# NR16 syscall, the disposition publication and the RISC-V post-lock consumer are
# unconditional. Feature-OFF RISC-V artifacts contain none of the Stage 200D-0D oracle literals.
riscv-exit-current-task-oracle = []

# Stage 200C2C1: default-off AArch64 LIVE reply-receive TIMEOUT retirement oracle. The AArch64 port
# of the accepted x86_64 cell — it REUSES the arch-neutral core verbatim and only adds the AArch64
# trap-entry wire, selector, userspace wrapper and live proof. Activation requires
# `target_arch = aarch64`, this feature, and the selector
# `yarm.aarch64_ipc_reply_timeout_oracle=timeout-wins|reply-wins`. Feature-OFF AArch64 artifacts
# contain none of the Stage 200C live/retirement marker literals.
aarch64-ipc-reply-timeout-oracle = ["ipc-reply-timeout-oracle-core"]

# Stage 200C2C2: default-off RISC-V LIVE reply-receive TIMEOUT retirement oracle — the third and
# final arch cell. REUSES the arch-neutral core verbatim (collector, deferred work, completion
# transaction, reversible reply lease, BlockedSyscallCompletion); only the selector, monotonic
# clock source, trap wiring, saved-context consumer, userspace wrapper and live proof differ.
# Activation requires `target_arch = riscv64`, this feature, and the selector
# `yarm.riscv_ipc_reply_timeout_oracle=timeout-wins|reply-wins`. Feature-OFF RISC-V artifacts
# contain none of the Stage 200C retirement marker literals.
riscv64-ipc-reply-timeout-oracle = ["ipc-reply-timeout-oracle-core"]

[dependencies]
yarm-ipc-abi = { path = "crates/yarm-ipc-abi" }
yarm-kernel = { path = "crates/yarm-kernel" }
yarm-srv-common = { path = "crates/yarm-srv-common" }

[[bin]]
name = "kernel_boot"
path = "src/bin/kernel_boot.rs"

[profile.dev]
panic = "abort"

[profile.x86-none]
inherits = "release"
panic = "abort"
lto = "thin"

[profile.aarch64-none]
inherits = "release"
panic = "abort"
lto = "thin"
