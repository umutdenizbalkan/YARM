# SPDX-License-Identifier: Apache-2.0

[package]
name = "yarm-control-plane-servers"
version = "0.1.0"
edition = "2024"
autobins = false

[features]
default = ["hosted-dev"]
hosted-dev = ["yarm/hosted-dev"]
legacy-tests = []
# Stage 200D-0B1: gates the disposable x86_64 ExitCurrentTask oracle task. Feature-off
# builds carry none of its literals.
x86-exit-current-task-oracle = []
# Stage 200D-0C1: gates the disposable AArch64 ExitCurrentTask oracle task. Feature-off
# builds carry none of its literals.
aarch64-exit-current-task-oracle = []
# Stage 200D-0D1: gates the disposable RISC-V ExitCurrentTask oracle task.
riscv-exit-current-task-oracle = []
# U9-SEND-FINAL §3: gates the disposable NR 1 SOURCE-FAULT witness task.
#
# It is a cargo feature and not only a runtime knob because init's address space already runs at
# `AddressSpace::MAX_MAPPINGS` on the provisioned oracle profile. The cell costs about 6 KiB of
# text, which is two more mapping runs, and the XFER2 grant witness needs exactly those two free
# to map its pair of pages. A feature-off build is BYTE-IDENTICAL to one without the cell, so
# every other slot-5 profile keeps the headroom it had. Feature-off builds carry none of its
# literals.
ipc-send-final-fault-witness = []
# U9-PAGEFAULT1 §3: gates the DEMAND page-fault witness.
#
# A cargo feature and not only a runtime knob, for the same measured reason as the two above:
# init's address space already runs at `AddressSpace::MAX_MAPPINGS` on the provisioned oracle
# profiles, so an unconditional cell costs mapping runs that other slot-5 witnesses need. A
# feature-off build is BYTE-IDENTICAL to one without the cell.
#
# It is ALSO default-off on its own merits, which the syscall-probe witnesses are not: this one
# deliberately takes real page faults, so it must never sit in the path of every profile sharing
# this image.
pagefault1-demand-witness = ["yarm-user-rt/pagefault1-demand-witness"]
# QEMU-BASELINE1 §3: runs the timer-contract witness in the supervisor. Default-off for the same
# reason as the demand witness: it deliberately spends time in the path of the profile it is in.
timer-contract-witness = ["yarm-user-rt/timer-contract-witness"]
# U9-FUTEX-WAIT-FINAL §4: gates the NR 9 NONBLOCKING-completion probe in the futex oracles.
#
# Same reason as `ipc-send-final-fault-witness`, measured the same way: init's address space runs
# at `AddressSpace::MAX_MAPPINGS` on the provisioned oracle profiles, and compiling the probe
# unconditionally cost one more mapping run — enough to make the XFER2 grant witness fail with
# `VM_FULL reason=mapping_bookkeeping_full max_mappings=128 va=0x40000000`. Feature-off builds
# carry none of its literals and are byte-identical to a build without it, so every other slot-5
# profile keeps the headroom it had.
futex-wait-nonblock-probe = []
# U9-TIMER5 §3: gates the IDLE-BOUNDARY RETURN witness cell in init.
#
# Same reason as `ipc-send-final-fault-witness`, measured the same way: init's address space runs
# at `AddressSpace::MAX_MAPPINGS` on the provisioned oracle profiles, and compiling this cell
# unconditionally cost one more mapping run — enough to make the XFER2 grant witness fail with
# `VM_FULL reason=mapping_bookkeeping_full max_mappings=128 va=0x40000000`. Feature-off builds
# carry none of its literals and are byte-identical to a build without it, so every other slot-5
# profile keeps the headroom it had.
timer5-idle-return-witness = []
recv-queue1-ordinary-grant = []

[dependencies]
yarm = { package = "yarm-server-runtime", path = "../yarm-server-runtime", default-features = false }
yarm-fs-servers = { path = "../yarm-fs-servers", default-features = false }
yarm-ipc-abi = { path = "../yarm-ipc-abi" }
yarm-srv-common = { path = "../yarm-srv-common" }
yarm-user-rt = { path = "../yarm-user-rt" }

[lib]
path = "src/lib.rs"
# Intentionally disable lib-test target compilation for now.
#
# Legacy `#[cfg(test)]` control-plane branches still depend on removed
# kernel/std-era APIs that are no longer exported through
# `yarm-server-runtime`. Re-enabling lib tests currently causes
# `--all-targets` workspace compile failures without affecting production
# binaries.
#
# Production surfaces remain covered by `cargo check --workspace`, while
# current shared contracts are validated in actively maintained test suites
# (`yarm-ipc-abi` and `yarm-srv-common`). Control-plane unit tests should be
# rebuilt later against transport-only/current ABI seams.
test = false

[[bin]]
name = "init_server"
path = "src/bin/init_server.rs"
test = false

[[bin]]
name = "process_manager"
path = "src/bin/process_manager.rs"
test = false

[[bin]]
name = "supervisor"
path = "src/bin/supervisor.rs"
test = false

[[bin]]
name = "driver_manager"
path = "src/bin/driver_manager.rs"
test = false

[[bin]]
name = "vfs_server"
path = "src/bin/vfs_server.rs"
test = false

[[bin]]
name = "crash_test_srv"
path = "src/bin/crash_test_srv.rs"
test = false
