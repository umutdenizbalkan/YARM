[package]
name = "yarm-fs-servers"
version = "0.1.0"
edition = "2024"
autobins = false

[features]
# Stage 200D-0B2: accepted as an UNUSED pass-through. `build-qemu-x86_64-artifacts.sh`
# applies one `BOOTSTRAP_FEATURE_ARGS` to every server package, so a feature that only
# `yarm` and `yarm-control-plane-servers` implement must still resolve here. This crate
# compiles no oracle code under it — the real gating stays where the oracle lives.
x86-exit-current-task-oracle = []
# Stage 200D-0C1: the AArch64 sibling, accepted as an UNUSED pass-through for the same
# reason — `build-qemu-aarch64-artifacts.sh` applies one feature set to every server
# package. This crate compiles no oracle code under it.
aarch64-exit-current-task-oracle = []
# U9-SEND-FINAL §3: accepted and inert here, so one `--features` argument can reach every
# package the artifact build touches. Only yarm-control-plane-servers acts on it.
ipc-send-final-fault-witness = []
# U9-PAGEFAULT1 §3: accepted and inert here, so one `--features` argument reaches every
# package the artifact build touches. Only yarm-control-plane-servers and yarm-user-rt act on it.
pagefault1-demand-witness = []
# QEMU-BASELINE1 §3: accepted and inert here, so one `--features` argument reaches every package
# the artifact build touches. Only yarm-control-plane-servers and yarm-user-rt act on it.
timer-contract-witness = []
# U9-FUTEX-WAIT-FINAL §4: gates the NR 9 NONBLOCKING-completion probe in the futex oracles.
#
# Same reason as `ipc-send-final-fault-witness`, measured the same way: init's address space runs
# at `AddressSpace::MAX_MAPPINGS` on the provisioned oracle profiles, and compiling the probe
# unconditionally cost one more mapping run — enough to make the XFER2 grant witness fail with
# `VM_FULL reason=mapping_bookkeeping_full max_mappings=128 va=0x40000000`. Feature-off builds
# carry none of its literals and are byte-identical to a build without it, so every other slot-5
# profile keeps the headroom it had.
futex-wait-nonblock-probe = []
# U9-TIMER5 §3: gates the IDLE-BOUNDARY RETURN witness cell in init.
#
# Same reason as `ipc-send-final-fault-witness`, measured the same way: init's address space runs
# at `AddressSpace::MAX_MAPPINGS` on the provisioned oracle profiles, and compiling this cell
# unconditionally cost one more mapping run — enough to make the XFER2 grant witness fail with
# `VM_FULL reason=mapping_bookkeeping_full max_mappings=128 va=0x40000000`. Feature-off builds
# carry none of its literals and are byte-identical to a build without it, so every other slot-5
# profile keeps the headroom it had.
timer5-idle-return-witness = []
riscv-uart-irq-witness = []
aarch64-pl011-irq-witness = []
x86_64-uart-irq-witness = []
context1-witness = []
context1-clobber = ["context1-witness"]
recv-queue1-ordinary-grant = []
# Stage 200D-0D1: the RISC-V sibling, an UNUSED pass-through for the same reason — one
# BOOTSTRAP_FEATURE_ARGS is applied to every server package. No oracle code compiles here.
riscv-exit-current-task-oracle = []
default = ["hosted-dev"]
hosted-dev = []

[dependencies]
yarm-server-runtime = { path = "../yarm-server-runtime", default-features = false }
yarm-user-rt = { path = "../yarm-user-rt" }
yarm-ipc-abi = { path = "../yarm-ipc-abi" }
yarm-srv-common = { path = "../yarm-srv-common" }

[lib]
path = "src/lib.rs"

[[bin]]
name = "devfs_srv"
path = "src/bin/devfs_srv.rs"

[[bin]]
name = "ramfs_srv"
path = "src/bin/ramfs_srv.rs"

[[bin]]
name = "initramfs_srv"
path = "src/bin/initramfs_srv.rs"

[[bin]]
name = "ext4_srv"
path = "src/bin/ext4_srv.rs"

[[bin]]
name = "fat_srv"
path = "src/bin/fat_srv.rs"
