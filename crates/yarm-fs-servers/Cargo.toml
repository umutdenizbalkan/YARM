# SPDX-License-Identifier: Apache-2.0

[package]
name = "yarm-fs-servers"
version = "0.1.0"
edition = "2024"
autobins = false

[features]
# Stage 200D-0B2: accepted as an UNUSED pass-through. `build-qemu-x86_64-artifacts.sh`
# applies one `BOOTSTRAP_FEATURE_ARGS` to every server package, so a feature that only
# `yarm` and `yarm-control-plane-servers` implement must still resolve here. This crate
# compiles no oracle code under it — the real gating stays where the oracle lives.
x86-exit-current-task-oracle = []
# Stage 200D-0C1: the AArch64 sibling, accepted as an UNUSED pass-through for the same
# reason — `build-qemu-aarch64-artifacts.sh` applies one feature set to every server
# package. This crate compiles no oracle code under it.
aarch64-exit-current-task-oracle = []
# Stage 200D-0D1: the RISC-V sibling, an UNUSED pass-through for the same reason — one
# BOOTSTRAP_FEATURE_ARGS is applied to every server package. No oracle code compiles here.
riscv-exit-current-task-oracle = []
default = ["hosted-dev"]
hosted-dev = []

[dependencies]
yarm-server-runtime = { path = "../yarm-server-runtime", default-features = false }
yarm-user-rt = { path = "../yarm-user-rt" }
yarm-ipc-abi = { path = "../yarm-ipc-abi" }
yarm-srv-common = { path = "../yarm-srv-common" }

[lib]
path = "src/lib.rs"

[[bin]]
name = "devfs_srv"
path = "src/bin/devfs_srv.rs"

[[bin]]
name = "ramfs_srv"
path = "src/bin/ramfs_srv.rs"

[[bin]]
name = "initramfs_srv"
path = "src/bin/initramfs_srv.rs"

[[bin]]
name = "ext4_srv"
path = "src/bin/ext4_srv.rs"

[[bin]]
name = "fat_srv"
path = "src/bin/fat_srv.rs"
